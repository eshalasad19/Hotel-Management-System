<!-- ========== Navbar Start ========== -->
<header id="page-topbar">
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <!-- LOGO -->
                <div class="navbar-brand-box horizontal-logo">
                    <a href="index.html" class="logo logo-dark">
                        <span class="logo-lg">
                            <span class="fw-bold fs-16">🏨 Hotel Manager</span>
                        </span>
                    </a>
                    <a href="index.html" class="logo logo-light">
                        <span class="logo-lg">
                            <span class="fw-bold fs-16 text-white">🏨 Hotel Manager</span>
                        </span>
                    </a>
                </div>

                <!-- Hamburger -->
                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger material-shadow-none" id="topnav-hamburger-icon">
                    <span class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>
            </div>

            <div class="d-flex align-items-center">

                <!-- Notifications -->
                <div class="dropdown topbar-head-dropdown ms-1 header-item" id="notificationDropdown">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class='bx bx-bell fs-22'></i>
                        <span class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger" id="notif-count" style="display:none;">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0">
                        <div class="dropdown-head bg-primary bg-pattern rounded-top">
                            <div class="p-3">
                                <div class="row align-items-center">
                                    <div class="col">
                                        <h6 class="m-0 fs-16 fw-semibold text-white">Notifications</h6>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div data-simplebar style="max-height: 300px;" id="notif-list">
                            <div class="text-center p-3 text-muted">Loading...</div>
                        </div>
                        <div class="my-3 text-center view-all">
                            <a href="notifications.html" class="btn btn-soft-success btn-sm">View All</a>
                        </div>
                    </div>
                </div>

                <!-- User Profile -->
                <div class="dropdown ms-sm-3 header-item topbar-user">
                    <button type="button" class="btn material-shadow-none" id="page-header-user-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <span class="d-flex align-items-center">
                            <div class="rounded-circle header-profile-user bg-primary d-flex align-items-center justify-content-center text-white fw-bold" id="navbar-user-initials" style="width:32px; height:32px; font-size:13px;">
                                A
                            </div>
                            <span class="text-start ms-xl-2">
                                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text" id="navbar-user-name">Admin</span>
                                <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text" id="navbar-user-role">Administrator</span>
                            </span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end">
                        <h6 class="dropdown-header">Welcome!</h6>
                        <a class="dropdown-item" href="profile.html">
                            <i class="mdi mdi-account-circle text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle">My Profile</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="navbar-logout-btn">
                            <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle">Sign Out</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</header>
<!-- ========== Navbar End ========== -->

<script>
// Navbar mein user info set karo
(function() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/auth-signin-basic.html';
        return;
    }

    const name = user.name || 'Admin';
    const role = user.role || 'admin';
    const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

    const nameEl = document.getElementById('navbar-user-name');
    const roleEl = document.getElementById('navbar-user-role');
    const initialsEl = document.getElementById('navbar-user-initials');

    if (nameEl) nameEl.textContent = name;
    if (roleEl) roleEl.textContent = role.charAt(0).toUpperCase() + role.slice(1);
    if (initialsEl) initialsEl.textContent = initials;

    // Logout
    const logoutBtn = document.getElementById('navbar-logout-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/auth-signin-basic.html';
        });
    }

    // Notifications load karo
    loadNotifications(token);
})();

async function loadNotifications(token) {
    try {
        const res = await fetch('http://localhost:5001/api/notifications/my', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const notifications = await res.json();

        const unread = notifications.filter(n => !n.isRead);
        const countEl = document.getElementById('notif-count');
        const listEl = document.getElementById('notif-list');

        if (unread.length > 0 && countEl) {
            countEl.textContent = unread.length;
            countEl.style.display = 'block';
        }

        if (listEl) {
            if (!notifications.length) {
                listEl.innerHTML = '<div class="text-center p-3 text-muted">No notifications</div>';
            } else {
                listEl.innerHTML = notifications.slice(0, 5).map(n => `
                    <div class="text-reset notification-item d-block dropdown-item position-relative ${!n.isRead ? 'active' : ''}">
                        <div class="d-flex">
                            <div class="avatar-xs me-3 flex-shrink-0">
                                <span class="avatar-title bg-info-subtle text-info rounded-circle fs-16">
                                    <i class="bx bx-bell"></i>
                                </span>
                            </div>
                            <div class="flex-grow-1">
                                <a href="#" class="stretched-link">
                                    <h6 class="mt-0 mb-2 lh-base">${n.title}</h6>
                                </a>
                                <p class="mb-0 fs-11 fw-medium text-uppercase text-muted">
                                    ${new Date(n.createdAt).toLocaleDateString('en-PK')}
                                </p>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }
    } catch(err) {
        console.error('Notifications error:', err);
    }
}
</script>
